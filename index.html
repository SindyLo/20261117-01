<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hk-計算機</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="./css/hk-計算機.css">
</head>

<body>
    <div class="all">
        <div class="top">
            <i class="fa-regular fa-clock"></i>
            <i class="fa-solid fa-calculator"></i>
        </div>
        <div class="mid">
            <div class="result">
                <div type="text" class="result-text">0</div>
            </div>
        </div>
        <div class="btm">
            <div class="btn-area">
                <button type="button" class="firstrow"> 
                    <i class="fa-solid fa-delete-left"></i>
                 </button>
                <button type="button" class="firstrow"> AC</button>
                <button type="button" class="firstrow"> % </button>
                <button type="button" class="func"> ÷ </button>
                <button type="button" class="normal"> 7 </button>
                <button type="button" class="normal"> 8 </button>
                <button type="button" class="normal"> 9 </button>
                <button type="button" class="func"> × </button>
                <button type="button" class="normal"> 4 </button>
                <button type="button" class="normal"> 5 </button>
                <button type="button" class="normal"> 6 </button>
                <button type="button" class="func"> - </button>
                <button type="button" class="normal"> 1 </button>
                <button type="button" class="normal"> 2 </button>
                <button type="button" class="normal"> 3 </button>
                <button type="button" class="func"> + </button>
                <button type="button" class="normal"> 
                    <i class="fa-solid fa-plus-minus"></i> 
                </button>
                <button type="button" class="normal"> 0 </button>
                <button type="button" class="normal"> . </button>
                <button type="button" class="func"> = </button>
            </div>
        </div>
    </div>
</body>
</html>
